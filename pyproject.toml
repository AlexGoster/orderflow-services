[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-services"
version = "1.0.0"
description = "OrderFlow Services — декомпозиция монолита на 4 микросервиса в одном репозитории"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=8.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = [".", "services/gateway", "services/order-service", "services/catalog-service", "services/notification-service"]
include = ["shared*", "gateway_app*", "order_app*", "catalog_app*", "notification_app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "services/gateway", "services/order-service", "services/catalog-service", "services/notification-service"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends()/Query() в аргументах по умолчанию — идиоматично для FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "gateway_app", "order_app", "catalog_app", "notification_app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = [
    "shared",
    "services/gateway/gateway_app",
    "services/order-service/order_app",
    "services/catalog-service/catalog_app",
    "services/notification-service/notification_app",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "services/gateway", "services/order-service", "services/catalog-service", "services/notification-service"]
addopts = "--strict-markers"

[tool.coverage.run]
source_pkgs = ["shared", "gateway_app", "order_app", "catalog_app", "notification_app"]

[tool.coverage.report]
show_missing = true
fail_under = 70
skip_empty = true
